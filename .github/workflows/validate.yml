name: Validate Culture Passport

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate experience data and site pages
        run: python scripts/validate.py
      - name: Check interactive JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/performance-interview.js
