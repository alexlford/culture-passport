name: Validate Culture Passport

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate experience data and site pages
        run: python scripts/validate.py
      - name: Audit static routes, deep links and staging privacy safeguards
        run: python scripts/audit_static_site.py
      - name: Print safe aggregate publication risk inventory
        run: python scripts/report_publication_risk.py
      - name: Validate clean visitor export without publishing
        run: python scripts/build_public_preview.py --check
      - name: Validate explicit story-review manifest and generate private review packet
        run: python scripts/audit_publication.py --check --report
      - name: Upload private publication review packet
        uses: actions/upload-artifact@v4
        with:
          name: culture-private-publication-review
          path: test-results/publication-review.md
          retention-days: 7
          if-no-files-found: error
      - name: Audit independent Passport navigation
        run: python scripts/audit_passport_navigation.py culture
      - name: Check interactive JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/performance-interview.js

  browser-smoke:
    name: Browser smoke · visitor preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser QA dependencies
        run: npm install --no-save --no-package-lock playwright@1.56.1 leaflet@1.9.4
      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Build minimal visitor-only artifact
        run: python scripts/build_public_preview.py --output dist
      - name: Test rendered pages at mobile and desktop widths
        run: node scripts/smoke_browser.mjs
      - name: Test loading recovery and independent private interview
        run: node scripts/smoke_loading.mjs
      - name: Upload private QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: culture-browser-screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 7

