name: Deploy Culture Passport

# Manual release only: review personally identifying stories and Git history first.
# Configure GitHub Pages only when you approve visitor content.
# On the currently private repository, check GitHub Pages plan/visibility eligibility first.
on:
  workflow_dispatch:
    inputs:
      privacy_review_approved:
        description: "I reviewed the generated visitor stories, venue data and Git privacy implications"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: culture-pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.privacy_review_approved == true }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site before publishing
        run: |
          python scripts/validate.py
          node --check assets/app.js
          node --check assets/performance-interview.js
      - name: Export visitor-only preview without private interview and reservation ledgers
        run: python scripts/build_public_preview.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
