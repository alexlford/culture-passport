name: Deploy Culture Passport

# Manual release only: review personally identifying stories and Git history first.
# A release-request file change on main is also an explicit, auditable manual release.
# Ordinary pushes never publish; the approved visitor-only export remains mandatory.
# Configure GitHub Pages only when you approve visitor content.
# The owner permits public source; only the approved visitor export is deployed.
on:
  workflow_dispatch:
    inputs:
      privacy_review_approved:
        description: "I reviewed the generated visitor stories, venue data and Git privacy implications"
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    paths:
      - '.github/deployment-request.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: culture-pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.privacy_review_approved == true) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved release request for commit-triggered publishing
        if: ${{ github.event_name == 'push' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          request = json.loads(Path('.github/deployment-request.json').read_text())
          assert request.get('approval') == 'explicit-user-request', 'Missing explicit release approval'
          assert request.get('target') == 'culture.alexlford.com', 'Unexpected publishing target'
          assert request.get('publish') == 'approved-visitor-export-only', 'Unsupported publication scope'
          PY
      - name: Validate site before publishing
        run: |
          python scripts/validate.py
          node --check assets/app.js
          node --check assets/performance-interview.js
      - name: Export visitor-only preview without private interview and reservation ledgers
        run: python scripts/build_public_preview.py
      - name: Require every visitor story to be explicitly approved and unchanged
        run: python scripts/audit_publication.py --require-approved
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
